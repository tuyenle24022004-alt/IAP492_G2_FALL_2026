seed: 42
classes: [binh_thuong, khoi, lua]
data_root: data/clients
output_root: outputs/model
threads: 2
model:
  arch: squeezenet1_1
  input_size: 128
  resize_mode: squash
  trainable: classifier
  pretrained_path: data/weights/squeezenet1_1_imagenet.pth
  pretrained_source: torchvision
experiments:
  name: so_sanh
  seeds: [42, 43, 44, 45, 46]
  trainable: [classifier, fire9_classifier]
  local_epochs: 30
  rounds: 20
fl:
  rounds: 50
  local_epochs: 1
  run_name: fedavg_50
train:
  epochs: 150
  final_weights: last
  batch: 64
  optimizer:
    name: sgd
    lr: 0.01
    momentum: 0.0
    weight_decay: 0.0
  scheduler:
    name: step
    step_size: 7
    gamma: 0.1
